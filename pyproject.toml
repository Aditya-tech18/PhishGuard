[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"
[project]
name = "phishguard"
version = "2.6.1"
description = "Privacy-first URL classification, Spark ETL and Kafka pipelines"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0.2,<7", "numpy>=1.26,<3"]
[project.optional-dependencies]
phish360 = ["pyzipper==0.4.0", "tldextract>=5.1,<6", "scikit-learn>=1.6,<2", "Pillow>=13.0,<14"]
api = ["fastapi>=0.115.6,<1", "uvicorn>=0.34,<1", "websockets>=13,<17", "httpx>=0.28,<1"]
ml = ["scikit-learn>=1.6,<2", "pandas>=2.2,<3", "pyarrow>=18,<24", "tldextract>=5.1,<6"]
spark = ["pyspark==3.5.8"]
streaming = ["confluent-kafka>=2.6,<3"]
dashboard = ["streamlit>=1.41,<2", "httpx>=0.28,<1"]
images = ["Pillow>=13.0,<14", "pandas>=2.2,<3", "pyarrow>=18,<24"]
vision = ["torch>=2.14,<3", "torchvision==0.29.2", "Pillow>=13.0,<14"]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "pip-audit>=2.8,<3", "bandit>=1.8,<2"]
browser = ["playwright>=1.65.2,<2"]
[project.scripts]
phishguard = "phishguard.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["spark: requires Java 17 and pyspark", "kafka: requires isolated Kafka broker", "vision: requires torch and Pillow", "browser: requires isolated Chromium and local sockets"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
"phishguard.web" = ["static/*.html", "static/assets/*"]
