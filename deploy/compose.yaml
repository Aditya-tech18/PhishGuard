# Run: docker compose -f deploy/compose.yaml up --build
# Export PHISHGUARD_API_KEY and set PHISHGUARD_MODEL_HOST to an absolute JSON model path.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports: ["127.0.0.1:${PHISHGUARD_API_PORT:-8000}:8000"]
    environment:
      PHISHGUARD_API_KEY: ${PHISHGUARD_API_KEY:?Export a random API key}
      PHISHGUARD_MODEL: /models/url-model.json
      PHISHGUARD_STORE_EVENTS: "false"
    volumes:
      - ${PHISHGUARD_MODEL_HOST:?Set absolute model path}:/models/url-model.json:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  vision:
    profiles: [vision]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.vision
    ports: ["127.0.0.1:${PHISHGUARD_VISION_API_PORT:-8001}:8000"]
    environment:
      PHISHGUARD_API_KEY: ${PHISHGUARD_API_KEY:?Export a random API key}
      PHISHGUARD_MODEL: /models/url-model.json
      PHISHGUARD_VISION_MODEL: /models/vision-model.pt
      PHISHGUARD_STORE_EVENTS: "false"
    volumes:
      - ${PHISHGUARD_MODEL_HOST:?Set absolute model path}:/models/url-model.json:ro
      - ${PHISHGUARD_VISION_MODEL_HOST:-../models/trained/vision-model.pt}:/models/vision-model.pt:ro
      - ${PHISHGUARD_VISION_REPORT_HOST:-../models/trained/vision-model.json}:/models/vision-model.json:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  kafka:
    image: apache/kafka:3.9.1
    profiles: [streaming]
    ports: ["127.0.0.1:${PHISHGUARD_KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${PHISHGUARD_KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 1
    volumes: [kafka-data:/tmp/kraft-combined-logs]
volumes:
  kafka-data:
